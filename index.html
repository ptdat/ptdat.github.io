<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pham Thanh Dat — Game Developer</title>
  <meta name="description" content="Pham Thanh Dat — Game Developer with 10+ years of Unity experience. Bilingual EN/VN." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #05060d;
      --bg-2: #0a0e1f;
      --panel: rgba(16, 21, 41, 0.66);
      --panel-border: rgba(0, 240, 255, 0.18);
      --neon-cyan: #00f0ff;
      --neon-magenta: #ff2bd6;
      --neon-violet: #8b5cff;
      --text: #e6f1ff;
      --text-dim: #8a97b8;
      --glow-cyan: rgba(0, 240, 255, 0.55);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      font-family: 'Rajdhani', 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      line-height: 1.6;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(60% 50% at 20% 10%, rgba(0, 240, 255, 0.10), transparent 70%),
        radial-gradient(50% 50% at 85% 20%, rgba(255, 43, 214, 0.10), transparent 70%),
        radial-gradient(60% 60% at 50% 100%, rgba(139, 92, 255, 0.12), transparent 70%),
        linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
      z-index: -2;
    }
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0, 240, 255, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 240, 255, 0.05) 1px, transparent 1px);
      background-size: 46px 46px;
      mask-image: radial-gradient(ellipse 80% 70% at 50% 35%, #000 30%, transparent 80%);
      -webkit-mask-image: radial-gradient(ellipse 80% 70% at 50% 35%, #000 30%, transparent 80%);
      z-index: -1;
      animation: gridDrift 24s linear infinite;
    }
    @keyframes gridDrift {
      from { background-position: 0 0, 0 0; }
      to { background-position: 46px 46px, 46px 46px; }
    }

    .wrap {
      max-width: 820px;
      margin: 0 auto;
      padding: 28px 22px 64px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    .brand {
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      letter-spacing: 2px;
      font-size: 14px;
      color: var(--neon-cyan);
      text-shadow: 0 0 12px var(--glow-cyan);
      text-decoration: none;
    }

    .lang-toggle {
      display: inline-flex;
      border: 1px solid var(--panel-border);
      border-radius: 999px;
      overflow: hidden;
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(6px);
    }
    .lang-toggle button {
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 1px;
      padding: 9px 16px;
      background: transparent;
      color: var(--text-dim);
      border: none;
      cursor: pointer;
      transition: all .25s ease;
    }
    .lang-toggle button.active {
      color: #04121a;
      background: linear-gradient(135deg, var(--neon-cyan), var(--neon-violet));
      box-shadow: 0 0 18px var(--glow-cyan);
    }
    .lang-toggle button:not(.active):hover { color: var(--text); }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px 0;
    }

    .avatar {
      width: 128px;
      height: 128px;
      border-radius: 28px;
      display: grid;
      place-items: center;
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: 40px;
      letter-spacing: 1px;
      color: var(--text);
      background: linear-gradient(145deg, rgba(0,240,255,0.16), rgba(255,43,214,0.16));
      border: 1px solid var(--panel-border);
      box-shadow: 0 0 36px rgba(0, 240, 255, 0.28), inset 0 0 28px rgba(139, 92, 255, 0.20);
      margin-bottom: 22px;
      animation: floaty 6s ease-in-out infinite;
    }
    @keyframes floaty {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: .5px;
      color: var(--neon-cyan);
      background: rgba(0, 240, 255, 0.08);
      border: 1px solid var(--panel-border);
      padding: 5px 13px;
      border-radius: 999px;
      margin-bottom: 16px;
    }
    .status-badge .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--neon-cyan);
      box-shadow: 0 0 10px var(--neon-cyan);
      animation: pulse 1.8s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: .4; transform: scale(.7); }
    }

    h1.name {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: clamp(34px, 7vw, 60px);
      line-height: 1.05;
      background: linear-gradient(120deg, #fff 10%, var(--neon-cyan) 50%, var(--neon-magenta) 95%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 22px rgba(0, 240, 255, 0.28));
      margin-bottom: 10px;
    }
    .title {
      font-size: clamp(17px, 3vw, 22px);
      font-weight: 600;
      color: var(--text);
      margin-bottom: 8px;
    }
    .tagline {
      font-size: 17px;
      color: var(--neon-cyan);
      letter-spacing: .3px;
      margin-bottom: 22px;
    }

    .intro {
      max-width: 600px;
      font-size: 17px;
      color: #c9d6f2;
      margin-bottom: 30px;
    }

    .highlights {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      width: 100%;
      max-width: 600px;
      margin-bottom: 36px;
    }
    .stat {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 16px;
      padding: 16px 10px;
      backdrop-filter: blur(8px);
      transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease;
    }
    .stat:hover {
      transform: translateY(-4px);
      border-color: rgba(0, 240, 255, 0.5);
      box-shadow: 0 8px 30px rgba(0, 240, 255, 0.18);
    }
    .stat .v {
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      font-size: 23px;
      color: var(--neon-cyan);
      text-shadow: 0 0 14px var(--glow-cyan);
    }
    .stat .l {
      font-size: 12px;
      color: var(--text-dim);
      margin-top: 4px;
    }

    .detail-btn {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      font-size: 16px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      text-decoration: none;
      color: #04121a;
      padding: 16px 34px;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--neon-cyan), var(--neon-violet));
      box-shadow: 0 0 28px rgba(0, 240, 255, 0.45), 0 0 64px rgba(139, 92, 255, 0.25);
      transition: transform .25s ease, box-shadow .25s ease;
    }
    .detail-btn:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 0 40px rgba(0, 240, 255, 0.65), 0 0 90px rgba(139, 92, 255, 0.4);
    }
    .detail-btn svg {
      width: 20px; height: 20px;
      stroke: #04121a;
      transition: transform .25s ease;
    }
    .detail-btn:hover svg { transform: translateX(5px); }

    footer {
      text-align: center;
      color: var(--text-dim);
      font-size: 13px;
      letter-spacing: .4px;
      padding-top: 24px;
    }

    .fade { animation: fadeUp .6s ease both; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .error-box { color: var(--text-dim); padding: 40px 0; }

    @media (max-width: 560px) {
      .highlights { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .avatar { width: 104px; height: 104px; font-size: 32px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <span class="brand">&lt;/&gt; PTD.DEV</span>
      <div class="lang-toggle" id="langToggle">
        <button data-lang="en">EN</button>
        <button data-lang="vi">VI</button>
      </div>
    </div>
    <main id="app">
      <div class="error-box">Loading…</div>
    </main>
    <footer id="footer"></footer>
  </div>

  <script>
    const STORAGE_KEY = 'ptd_lang';
    let DATA = null;
    let lang = 'en';

    function getStoredLang() {
      try { return localStorage.getItem(STORAGE_KEY); } catch (e) { return null; }
    }
    function setStoredLang(l) {
      try { localStorage.setItem(STORAGE_KEY, l); } catch (e) {}
    }

    function t(field) {
      if (field == null) return '';
      if (typeof field === 'string') return field;
      return field[lang] != null ? field[lang] : (field.en || '');
    }

    function esc(s) {
      return String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
    }

    function render() {
      if (!DATA) return;
      const p = DATA.profile;
      const cta = (DATA.ui && DATA.ui.cta) || {};
      document.documentElement.lang = lang;
      document.title = t(p.name) + ' — ' + t(p.title);

      const intro = (p.about && p.about.paragraphs)
        ? ((p.about.paragraphs[lang] || p.about.paragraphs.en || [])[0] || '')
        : '';

      const highlights = (p.highlights || []).map(h => `
        <div class="stat">
          <div class="v">${esc(t(h.value))}</div>
          <div class="l">${esc(t(h.label))}</div>
        </div>`).join('');

      const arrow = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';

      document.getElementById('app').innerHTML = `
        <div class="avatar fade">${esc(p.initials || '')}</div>
        ${p.status ? `<div class="status-badge fade"><span class="dot"></span>${esc(t(p.status))}</div>` : ''}
        <h1 class="name fade">${esc(t(p.name))}</h1>
        <div class="title fade">${esc(t(p.title))}</div>
        <div class="tagline fade">${esc(t(p.tagline))}</div>
        ${intro ? `<p class="intro fade">${esc(intro)}</p>` : ''}
        ${highlights ? `<div class="highlights fade">${highlights}</div>` : ''}
        <a class="detail-btn fade" href="profile/">${esc(t(cta.detail) || 'Detail')} ${arrow}</a>
      `;
      document.getElementById('footer').innerHTML = esc(t(DATA.ui && DATA.ui.footer));

      document.querySelectorAll('#langToggle button').forEach(b => {
        b.classList.toggle('active', b.dataset.lang === lang);
      });
    }

    function setLang(l) {
      lang = l;
      setStoredLang(l);
      render();
    }

    document.getElementById('langToggle').addEventListener('click', e => {
      const btn = e.target.closest('button');
      if (btn) setLang(btn.dataset.lang);
    });

    fetch('data.json')
      .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(d => {
        DATA = d;
        const langs = (d.site && d.site.languages) || ['en', 'vi'];
        const stored = getStoredLang();
        lang = (stored && langs.includes(stored)) ? stored : ((d.site && d.site.defaultLang) || 'en');
        render();
      })
      .catch(err => {
        document.getElementById('app').innerHTML =
          '<div class="error-box">Could not load <b>data.json</b>.<br>Serve this page over HTTP (e.g. GitHub Pages or a local server).<br><small>' + esc(err.message) + '</small></div>';
      });
  </script>
</body>
</html>
