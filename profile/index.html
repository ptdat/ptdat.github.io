<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pham Thanh Dat — Game Developer</title>
  <meta name="description" content="Pham Thanh Dat — Game Developer with 10+ years of Unity experience. Bilingual EN/VN profile." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #05060d;
      --bg-2: #0a0e1f;
      --panel: rgba(16, 21, 41, 0.66);
      --panel-border: rgba(0, 240, 255, 0.18);
      --neon-cyan: #00f0ff;
      --neon-magenta: #ff2bd6;
      --neon-violet: #8b5cff;
      --text: #e6f1ff;
      --text-dim: #8a97b8;
      --glow-cyan: rgba(0, 240, 255, 0.55);
      --glow-magenta: rgba(255, 43, 214, 0.45);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Rajdhani', 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      line-height: 1.6;
    }

    /* Animated background */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(60% 50% at 20% 10%, rgba(0, 240, 255, 0.10), transparent 70%),
        radial-gradient(50% 50% at 85% 20%, rgba(255, 43, 214, 0.10), transparent 70%),
        radial-gradient(60% 60% at 50% 100%, rgba(139, 92, 255, 0.12), transparent 70%),
        linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
      z-index: -2;
    }
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0, 240, 255, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 240, 255, 0.05) 1px, transparent 1px);
      background-size: 46px 46px;
      mask-image: radial-gradient(ellipse 80% 70% at 50% 30%, #000 30%, transparent 80%);
      -webkit-mask-image: radial-gradient(ellipse 80% 70% at 50% 30%, #000 30%, transparent 80%);
      z-index: -1;
      animation: gridDrift 24s linear infinite;
    }
    @keyframes gridDrift {
      from { background-position: 0 0, 0 0; }
      to { background-position: 46px 46px, 46px 46px; }
    }

    .wrap {
      max-width: 920px;
      margin: 0 auto;
      padding: 28px 22px 64px;
    }

    /* Top bar */
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 48px;
    }
    .brand {
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      letter-spacing: 2px;
      font-size: 14px;
      color: var(--neon-cyan);
      text-shadow: 0 0 12px var(--glow-cyan);
    }

    .lang-toggle {
      display: inline-flex;
      border: 1px solid var(--panel-border);
      border-radius: 999px;
      overflow: hidden;
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(6px);
    }
    .lang-toggle button {
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 1px;
      padding: 9px 16px;
      background: transparent;
      color: var(--text-dim);
      border: none;
      cursor: pointer;
      transition: all .25s ease;
    }
    .lang-toggle button.active {
      color: #04121a;
      background: linear-gradient(135deg, var(--neon-cyan), var(--neon-violet));
      text-shadow: none;
      box-shadow: 0 0 18px var(--glow-cyan);
    }
    .lang-toggle button:not(.active):hover { color: var(--text); }

    /* Hero */
    .hero {
      display: flex;
      gap: 28px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 40px;
    }
    .avatar {
      width: 124px;
      height: 124px;
      flex: none;
      border-radius: 24px;
      display: grid;
      place-items: center;
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: 38px;
      letter-spacing: 1px;
      color: var(--text);
      background: linear-gradient(145deg, rgba(0,240,255,0.14), rgba(255,43,214,0.14));
      border: 1px solid var(--panel-border);
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.22), inset 0 0 26px rgba(139, 92, 255, 0.18);
      position: relative;
      animation: floaty 6s ease-in-out infinite;
    }
    @keyframes floaty {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }
    .hero-text { flex: 1; min-width: 260px; }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: .5px;
      color: var(--neon-cyan);
      background: rgba(0, 240, 255, 0.08);
      border: 1px solid var(--panel-border);
      padding: 5px 13px;
      border-radius: 999px;
      margin-bottom: 14px;
    }
    .status-badge .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--neon-cyan);
      box-shadow: 0 0 10px var(--neon-cyan);
      animation: pulse 1.8s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: .4; transform: scale(.7); }
    }
    h1.name {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: clamp(30px, 6vw, 52px);
      line-height: 1.05;
      background: linear-gradient(120deg, #fff 10%, var(--neon-cyan) 50%, var(--neon-magenta) 95%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 20px rgba(0, 240, 255, 0.25));
      margin-bottom: 8px;
    }
    .title {
      font-size: clamp(16px, 2.6vw, 20px);
      font-weight: 600;
      color: var(--text);
      margin-bottom: 6px;
    }
    .tagline {
      font-size: 16px;
      color: var(--text-dim);
      margin-bottom: 12px;
    }
    .location {
      font-size: 14px;
      color: var(--text-dim);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .location svg { width: 15px; height: 15px; stroke: var(--neon-violet); }

    /* Highlights */
    .highlights {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 44px;
    }
    .stat {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 16px;
      padding: 18px 14px;
      text-align: center;
      backdrop-filter: blur(8px);
      transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease;
    }
    .stat:hover {
      transform: translateY(-4px);
      border-color: rgba(0, 240, 255, 0.5);
      box-shadow: 0 8px 30px rgba(0, 240, 255, 0.18);
    }
    .stat .v {
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      font-size: 26px;
      color: var(--neon-cyan);
      text-shadow: 0 0 14px var(--glow-cyan);
    }
    .stat .l {
      font-size: 13px;
      color: var(--text-dim);
      margin-top: 4px;
      letter-spacing: .3px;
    }

    /* Sections */
    section.card {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 20px;
      padding: 30px 28px;
      backdrop-filter: blur(10px);
      margin-bottom: 26px;
      position: relative;
      overflow: hidden;
    }
    section.card::before {
      content: "";
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 2px;
      background: linear-gradient(90deg, transparent, var(--neon-cyan), var(--neon-magenta), transparent);
      opacity: .7;
    }
    .section-title {
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--neon-magenta);
      text-shadow: 0 0 12px var(--glow-magenta);
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .section-title::after {
      content: "";
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, var(--panel-border), transparent);
    }
    .about p {
      font-size: 17px;
      color: #c9d6f2;
      margin-bottom: 14px;
    }
    .about p:last-child { margin-bottom: 0; }

    .tags { display: flex; flex-wrap: wrap; gap: 10px; }
    .tag {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: .3px;
      padding: 8px 15px;
      border-radius: 999px;
      color: var(--text);
      background: rgba(139, 92, 255, 0.10);
      border: 1px solid rgba(139, 92, 255, 0.32);
      transition: all .2s ease;
    }
    .tag:hover {
      background: rgba(0, 240, 255, 0.12);
      border-color: var(--neon-cyan);
      box-shadow: 0 0 16px rgba(0, 240, 255, 0.25);
    }

    footer {
      text-align: center;
      color: var(--text-dim);
      font-size: 13px;
      letter-spacing: .4px;
      margin-top: 40px;
    }

    /* fade-in */
    .fade { animation: fadeUp .6s ease both; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .error-box {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-dim);
    }

    @media (max-width: 620px) {
      .highlights { grid-template-columns: repeat(2, 1fr); }
      .hero { gap: 20px; }
      .avatar { width: 96px; height: 96px; font-size: 30px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">&lt;/&gt; PTD.DEV</div>
      <div class="lang-toggle" id="langToggle">
        <button data-lang="en">EN</button>
        <button data-lang="vi">VI</button>
      </div>
    </div>
    <main id="app">
      <div class="error-box">Loading…</div>
    </main>
  </div>

  <script>
    const STORAGE_KEY = 'ptd_lang';
    let DATA = null;
    let lang = 'en';

    function getStoredLang() {
      try { return localStorage.getItem(STORAGE_KEY); } catch (e) { return null; }
    }
    function setStoredLang(l) {
      try { localStorage.setItem(STORAGE_KEY, l); } catch (e) {}
    }

    function t(field) {
      // field is an object like { en, vi } or a plain string
      if (field == null) return '';
      if (typeof field === 'string') return field;
      return field[lang] != null ? field[lang] : (field.en || '');
    }

    function esc(s) {
      return String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
    }

    function render() {
      if (!DATA) return;
      const p = DATA.profile;
      document.documentElement.lang = lang;
      document.title = t(p.name) + ' — ' + t(p.title);

      const highlights = (p.highlights || []).map(h => `
        <div class="stat">
          <div class="v">${esc(t(h.value))}</div>
          <div class="l">${esc(t(h.label))}</div>
        </div>`).join('');

      const paras = (p.about && p.about.paragraphs)
        ? (p.about.paragraphs[lang] || p.about.paragraphs.en || []).map(x => `<p>${esc(x)}</p>`).join('')
        : '';

      const tags = (p.focus && p.focus.tags)
        ? p.focus.tags.map(x => `<span class="tag">${esc(t(x))}</span>`).join('')
        : '';

      const locationIcon = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>';

      document.getElementById('app').innerHTML = `
        <div class="hero fade">
          <div class="avatar">${esc(p.initials || '')}</div>
          <div class="hero-text">
            ${p.status ? `<div class="status-badge"><span class="dot"></span>${esc(t(p.status))}</div>` : ''}
            <h1 class="name">${esc(t(p.name))}</h1>
            <div class="title">${esc(t(p.title))}</div>
            <div class="tagline">${esc(t(p.tagline))}</div>
            ${p.location ? `<div class="location">${locationIcon}${esc(t(p.location))}</div>` : ''}
          </div>
        </div>

        ${highlights ? `<div class="highlights fade">${highlights}</div>` : ''}

        <section class="card about fade">
          <div class="section-title">${esc(t(p.about.heading))}</div>
          ${paras}
        </section>

        ${tags ? `
        <section class="card fade">
          <div class="section-title">${esc(t(p.focus.heading))}</div>
          <div class="tags">${tags}</div>
        </section>` : ''}

        <footer>${esc(t(DATA.ui && DATA.ui.footer))}</footer>
      `;

      document.querySelectorAll('#langToggle button').forEach(b => {
        b.classList.toggle('active', b.dataset.lang === lang);
      });
    }

    function setLang(l) {
      lang = l;
      setStoredLang(l);
      render();
    }

    document.getElementById('langToggle').addEventListener('click', e => {
      const btn = e.target.closest('button');
      if (btn) setLang(btn.dataset.lang);
    });

    fetch('data.json')
      .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(d => {
        DATA = d;
        const langs = (d.site && d.site.languages) || ['en', 'vi'];
        const stored = getStoredLang();
        lang = (stored && langs.includes(stored)) ? stored : ((d.site && d.site.defaultLang) || 'en');
        render();
      })
      .catch(err => {
        document.getElementById('app').innerHTML =
          '<div class="error-box">Could not load <b>data.json</b>.<br>Serve this page over HTTP (e.g. GitHub Pages or a local server).<br><small>' + esc(err.message) + '</small></div>';
      });
  </script>
</body>
</html>
